name: Build Flet Multiplatform (Android & Windows)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"

jobs:
  # --- COMPILAZIONE ANDROID ---
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Find Flet Directory and Install Dependencies
      run: |
        python -m pip install --upgrade pip
        FLET_DIR=$(dirname $(find . -name "main.py" | head -n 1))
        echo "FLET_DIR=$FLET_DIR" >> $GITHUB_ENV
        cd $FLET_DIR
        pip install flet==0.85.1 flet-charts==0.85.1
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet
      run: |
        if [ -d "common" ]; then
          cp -r common ${{ env.FLET_DIR }}/common
        fi

    - name: Build APK with Flet
      run: |
        cd ${{ env.FLET_DIR }}
        echo "y" | flet build apk --exclude flet
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-android-apk
        path: "${{ env.FLET_DIR }}/build/apk/*.apk"

  # --- COMPILAZIONE WINDOWS ---
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Find Flet Directory and Install Dependencies (Windows)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        FLET_DIR=$(dirname $(find . -name "main.py" | head -n 1))
        echo "FLET_DIR=$FLET_DIR" >> $GITHUB_ENV
        cd $FLET_DIR
        # Installiamo flet alla versione esatta + tutte le dipendenze del tuo requirements.txt
        pip install flet==0.85.1 flet-charts==0.85.1
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # Forziamo la build a usare Flutter 3.19 (compatibile al 100% con Flet 0.85)
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet (Windows)
      shell: bash
      run: |
        if [ -d "common" ]; then
          cp -r common ${{ env.FLET_DIR }}/common
        fi

    - name: Build Windows EXE
      shell: bash
      run: |
        cd ${{ env.FLET_DIR }}
        # Comando pulito per Flet 0.85.1
        echo "y" | flet build windows --exclude flet

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-windows-exe
        path: "${{ env.FLET_DIR }}/build/windows/**"