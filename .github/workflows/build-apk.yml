name: Build Flet APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Find Flet Directory and Install Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Cerca la cartella che contiene il main.py di Flet
        FLET_DIR=$(dirname $(find . -name "main.py" | head -n 1))
        echo "FLET_DIR=$FLET_DIR" >> $GITHUB_ENV
        
        echo "La cartella Flet rilevata è: $FLET_DIR"
        
        # Entra nella cartella trovata e installa i requisiti
        cd $FLET_DIR
        pip install flet flet-charts
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet
      run: |
        # Se esiste una cartella common nella radice, la copia all'interno della cartella di Flet
        if [ -d "common" ]; then
          cp -r common ${{ env.FLET_DIR }}/common
          echo "Cartella common copiata in ${{ env.FLET_DIR }}/common"
        else
          echo "Nessuna cartella common trovata nella radice."
        fi

    - name: Build APK with Flet
      run: |
        cd ${{ env.FLET_DIR }}
        echo "y" | flet build apk --exclude flet
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-release-apk
        path: "${{ env.FLET_DIR }}/build/apk/*.apk"