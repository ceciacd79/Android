name: Build Flet Multiplatform (Android & Windows)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"

jobs:
  # --- COMPILAZIONE ANDROID ---
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Find Flet Directory and Install Dependencies
      run: |
        python -m pip install --upgrade pip
        FLET_DIR=$(dirname $(find . -name "main.py" | head -n 1))
        echo "FLET_DIR=$FLET_DIR" >> $GITHUB_ENV
        cd $FLET_DIR
        pip install flet==0.85.1 flet-charts==0.85.1
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet
      run: |
        if [ -d "common" ]; then
          cp -r common ${{ env.FLET_DIR }}/common
        fi

    - name: Build APK with Flet
      run: |
        cd ${{ env.FLET_DIR }}
        echo "y" | flet build apk --exclude flet
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-android-apk
        path: "${{ env.FLET_DIR }}/build/apk/*.apk"

  # --- COMPILAZIONE WINDOWS ---
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Find Flet Directory and Pre-install Dependencies Locally
      # 🔑 Cambiamo la shell in PowerShell (nativa di Windows) per gestire i percorsi senza errori
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        
        # Trova la cartella contenente main.py usando comandi Windows
        $FletDir = Get-ChildItem -Filter "main.py" -Recurse | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
        Write-Output "Flet directory found at: $FletDir"
        
        # Salviamo la variabile d'ambiente per i passi successivi
        echo "FLET_DIR=$FletDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
        # Entriamo fisicamente nella cartella del progetto
        cd "$FletDir"
        
        # Installiamo Flet e le dipendenze direttamente dentro la cartella del progetto (. significa cartella corrente)
        pip install flet==0.85.1 flet-charts==0.85.1 --target .
        if (Test-Path "requirements.txt") {
            pip install -r requirements.txt --target .
        }

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet (Windows)
      shell: powershell
      run: |
        cd "${{ env.FLET_DIR }}"
        if (Test-Path "../common") {
            Copy-Item -Path "../common" -Destination "./common" -Recurse -Force
        }

    - name: Build Windows EXE
      shell: powershell
      run: |
        cd "${{ env.FLET_DIR }}"
        # Forziamo l'accettazione dei prompt inviando "y"
        echo "y" | python -m flet build windows --exclude flet

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-windows-exe
        path: "${{ env.FLET_DIR }}/build/windows/**"