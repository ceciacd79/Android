name: Build Flet APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

# Forza l'uso di Node.js 24 a livello globale nel workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Aggiornato alla v5 (supporta Node 24)
    - name: Checkout repository
      uses: actions/checkout@v5

    # Aggiornato alla v6 (supporta Node 24)
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd Flet
        pip install flet flet-charts
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        cd ..

    # Aggiornato alla v5 (supporta Node 24)
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Prepare Common Files for Flet
      run: |
        cp -r common Flet/common

    - name: Build APK with Flet
      run: |
        cd Flet
        echo "y" | flet build apk
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flet-release-apk
        path: Flet/build/apk/*.apk